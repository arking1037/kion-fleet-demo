<style id="role-v1-styles">
:root{--rv1-red:#d4001a;--rv1-red-dark:#a90015;--rv1-ink:#1b1d21;--rv1-muted:#656a73;--rv1-line:#dfe2e7;--rv1-bg:#f4f5f7;--rv1-card:#fff;--rv1-good:#087a4b;--rv1-warn:#a45a00;--rv1-bad:#b42318;--rv1-blue:#175cd3}
body.rv1-active{margin:0;overflow:hidden;overscroll-behavior:none;background:var(--rv1-bg);color:var(--rv1-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body.rv1-active.rv1-legacy-active{overflow:auto;overscroll-behavior:auto}
body.rv1-active #root[hidden],#role-v1-root[hidden],#role-legacy-exit[hidden]{display:none!important}
#role-v1-root{block-size:100dvh;min-block-size:100svh;overflow:hidden;background:linear-gradient(180deg,#eef0f3 0,#f7f7f8 18rem,#f4f5f7 100%)}
#role-v1-root *{box-sizing:border-box}
.rv1-skip{position:fixed;inset-block-start:.5rem;inset-inline-start:.5rem;z-index:10000;transform:translateY(-150%);padding:.75rem 1rem;border-radius:.5rem;background:#fff;color:#111;font-weight:700;box-shadow:0 4px 18px #0003}
.rv1-skip:focus{transform:none}
.rv1-shell{block-size:100%;min-block-size:0;display:grid;grid-template-areas:"header" "main" "nav";grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.rv1-header{grid-area:header;position:relative;z-index:30;background:#101216;color:#fff;border-block-end:3px solid var(--rv1-red)}
.rv1-header-inner{max-inline-size:1180px;margin-inline:auto;min-block-size:68px;padding:.65rem clamp(1rem,3vw,2rem);display:flex;align-items:center;gap:1rem}
.rv1-brand{display:flex;align-items:center;gap:.7rem;min-inline-size:0}
.rv1-mark{display:grid;place-items:center;inline-size:42px;block-size:42px;border-radius:11px;background:var(--rv1-red);color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.03em;flex:none}
.rv1-brand-copy{min-inline-size:0}.rv1-brand-copy strong,.rv1-brand-copy span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rv1-brand-copy strong{font-size:1rem}.rv1-brand-copy span{margin-block-start:.1rem;color:#c8cbd1;font-size:.78rem}
.rv1-account{margin-inline-start:auto;text-align:end;min-inline-size:0}.rv1-account strong,.rv1-account small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rv1-account small{color:#c8cbd1}
.rv1-button,.rv1-nav-button,.rv1-account-button,.rv1-card-button,.rv1-link-button{font:inherit;min-block-size:48px;border-radius:.65rem;cursor:pointer}
.rv1-button{border:1px solid transparent;padding:.7rem 1rem;font-weight:700;background:var(--rv1-red);color:#fff}.rv1-button:hover{background:var(--rv1-red-dark)}
.rv1-button.rv1-secondary{background:#fff;color:var(--rv1-ink);border-color:#b7bcc4}.rv1-button.rv1-secondary:hover{background:#f1f2f4}
.rv1-button.rv1-quiet{background:transparent;color:inherit;border-color:#ffffff55}.rv1-button.rv1-quiet:hover{background:#ffffff14}
.rv1-button.rv1-danger{background:#fff;color:var(--rv1-bad);border-color:#d9a39e}

function clone(value){return JSON.parse(JSON.stringify(value))}
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char])}
function money(value){return `¥${Number(value).toLocaleString("zh-CN")}`}
function daysBetween(from,to){if(!from)return null;const a=Date.parse(`${from}T00:00:00+08:00`),b=Date.parse(`${to}T00:00:00+08:00`);if(!Number.isFinite(a)||!Number.isFinite(b)||b<a)return null;return Math.floor((b-a)/86400000)}
function badge(text,tone=""){return `<span class="rv1-badge ${tone}">${esc(text)}</span>`}

function rentalStore(){return loadScoped(RENTAL_KEY,RENTAL_SEED,"rental","tenant-rental-demo")}
function loadScoped(key,seed,role,tenantId){
 let value=null;
 try{value=JSON.parse(localStorage.getItem(key)||"null")}catch{value=null}
 if(!value||value.schema!==4||value.role!==role||value.tenantId!==tenantId)return clone(seed);
 return value;
}
function saveScoped(key,value,role,tenantId){
 if(!value||value.schema!==4||value.role!==role||value.tenantId!==tenantId)throw new Error("演示数据范围校验失败");
 localStorage.setItem(key,JSON.stringify(value));
}
function requireCustomerScope(account){
 if(!account||account.role!=="customer"||account.tenantId!=="tenant-starland")throw new Error("客户读取范围校验失败");
 const data=customerStore();
 if(data.role!==account.role||data.tenantId!==account.tenantId)throw new Error("客户租户数据不匹配");
 return data;
}
function getCustomerAlarm(account,id){
 const data=requireCustomerScope(account),alarm=data.alerts.find(item=>item.id===id);
 if(!alarm)throw new Error("报警不在当前企业范围");
 const vehicle=data.vehicles.find(item=>item.id===alarm.vehicleId);
 if(!vehicle)throw new Error("报警车辆不在当前企业范围");
 const order=alarm.workOrderId?data.orders.find(item=>item.id===alarm.workOrderId):null;
 const otherOrders=data.orders.filter(item=>item.vehicleId===vehicle.id&&item.id!==alarm.workOrderId);
 return{alarm,vehicle,order,otherOrders};
}
function getCustomerVehicle(account,id){
 const data=requireCustomerScope(account),vehicle=data.vehicles.find(item=>item.id===id);
 if(!vehicle)throw new Error("车辆不在当前企业范围");
 return{vehicle,alerts:data.alerts.filter(item=>item.vehicleId===id),orders:data.orders.filter(item=>item.vehicleId===id)};
}
function getCustomerOrder(account,id){
 const data=requireCustomerScope(account),order=data.orders.find(item=>item.id===id);
 if(!order)throw new Error("工单不在当前企业范围");
 const vehicle=data.vehicles.find(item=>item.id===order.vehicleId);
 if(!vehicle)throw new Error("工单车辆不在当前企业范围");
 return{order,vehicle,alerts:data.alerts.filter(item=>item.workOrderId===id)};
}
function createCustomerOrder(account,vehicle,summary,priority="普通"){
 if(!account||account.role!=="customer"||account.tenantId!=="tenant-starland")throw new Error("客户账号范围校验失败");
 const data=customerStore(),clean=String(summary||"").trim();
 if(!data.vehicles.some(item=>item.id===vehicle))throw new Error("车辆不在当前企业授权范围");
 if(clean.length<4||clean.length>180)throw new Error("故障描述长度不符合要求");
 const order={id:`WO-DEMO-${Date.now().toString().slice(-6)}`,vehicleId:vehicle,summary:clean,status:"待接单",source:"用户报修",priority,progress:"演示工单已提交，等待工程师接单",createdAt:new Intl.DateTimeFormat("zh-CN",{dateStyle:"short",timeStyle:"short",hour12:false}).format(new Date())};
 data.orders.unshift(order);saveScoped(CUSTOMER_KEY,data,"customer",account.tenantId);return order;
}

function registerRentalPayment(account,id,amount,note){
 if(!account||account.role!=="rental"||account.tenantId!=="tenant-rental-demo")throw new Error("租赁商账号范围校验失败");
 const data=rentalStore(),rec=data.receivables.find(item=>item.id===id),value=Number(amount);
 if(!rec)throw new Error("未找到应收记录");
 const balance=Math.max(0,rec.amount-rec.paid);
 if(!(value>0)||value>balance)throw new Error(`金额应大于 0 且不超过 ${balance}`);
 rec.paid+=value;const payment={id:`pay-demo-${Date.now()}`,receivableId:id,amount:value,operator:"租赁经营管理员（演示）",time:new Intl.DateTimeFormat("zh-CN",{dateStyle:"short",timeStyle:"short",hour12:false}).format(new Date()),note:String(note||"").slice(0,120)};

}

="rv1-section-heading"><h2>快捷处理</h2><p>基于现有模块，不新增语音识别</p></div><section class="rv1-grid rv1-three"><button type="button" class="rv1-card-button" data-action="open-report"><strong>故障报修</strong><small>填写并确认后生成本地演示工单</small></button><button type="button" class="rv1-card-button" data-page="orders"><strong>查看工单进度</strong><small>待接单、处理中、已关闭</small></button><button type="button" class="rv1-card-button" data-page="contracts"><strong>合同与付款状态</strong><small>首期完全只读，无支付入口</small></button></section><div class="rv1-section-heading"><h2>设备报警（模拟）</h2><p>与普通待办消息分开</p></div><div class="rv1-banner rv1-warn"><strong>未接真实设备</strong>以下报警均为脱敏示例，不会自动创建真实工单、停租、锁车或发送设备指令。</div><ul class="rv1-list" role="list">${data.alerts.map(alert=>`<li><button type="button" class="rv1-card-button" data-alarm="${esc(alert.id)}"><span class="rv1-list-row"><span><strong>${esc(alert.title)}</strong><small>${esc(alert.vehicleId)} · ${esc(alert.occurredAt)} · ${alert.workOrderId?`关联工单 ${esc(alert.workOrderId)}`:"本条报警未关联工单"}</small></span>${badge(alert.severity,alarmTone(alert.severity))}</span></button></li>`).join("")}</ul><div class="rv1-section-heading"><h2>普通待办消息</h2><p>点检与维修进度，不是设备报警</p></div><ul class="rv1-list" role="list">${data.reminders.map(item=>`<li class="rv1-list-item"><div class="rv1-list-row"><div><h3>${esc(item.title)}</h3><p>${esc(item.detail)}</p><div class="rv1-meta"><span>车辆 ${esc(item.vehicleId)}</span><span>${esc(item.status)}</span></div></div>${badge(item.kind,"blue")}</div></li>`).join("")}</ul>${reportDialog(data)}`}

function customerContracts(data){return `${heading("合同、账单与付款状态","首期客户权限为完全只读：没有编辑、收付款登记、付款凭证或在线支付入口。")}${data.contracts.map(contract=>`<article class="rv1-card rv1-readonly" style="margin-block-start:1rem"><div class="rv1-list-row"><div><h2>${esc(contract.no)}</h2><p class="rv1-lead">${esc(contract.vehicleIds.join("、"))}</p></div>${badge(contract.status,"good")}</div><div class="rv1-readonly-note"><strong>只读</strong><span>交付日与计租生效日分别记录，交付不会自动使合同生效。</span></div><dl class="rv1-dl"><div><dt>交付日期</dt><dd>${esc(contract.deliveryDate)}</dd></div><div><dt>计租生效日期</dt><dd>${esc(contract.effectiveDate)}</dd></div><div><dt>合同到期日期</dt><dd>${esc(contract.endDate)}</dd></div><div><dt>账单期间</dt><dd>${esc(contract.bill.period)}</dd></div><div><dt>账单金额（示例）</dt><dd>${money(contract.bill.amount)}</dd></div><div><dt>应付日期</dt><dd>${esc(contract.bill.dueDate)}</dd></div><div><dt>付款状态</dt><dd>${badge(contract.bill.paymentStatus,"warn")}</dd></div></dl></article>`).join("")}`}
function accountPage(account){const metricScope=account.role==="rental"?`<div class="rv1-banner rv1-info"><strong>出租比例口径</strong>当前在租车辆 ÷ 经营车辆池；经营池仅含业务状态为在租、可租、维修、待交付的车辆，排除已处置车辆、电池和充电机。可租闲置天数只计算可租未出租车辆，维修天数另计；缺少示例状态起始日则显示暂无。</div>`:"";return `${heading("账号与演示边界",`${account.company} · ${account.label}`)}<section class="rv1-card" style="margin-block-start:1rem"><h2>固定身份</h2><dl class="rv1-dl"><div><dt>企业</dt><dd>${esc(account.company)}</dd></div><div><dt>主要身份</dt><dd>${esc(account.label)}</dd></div><div><dt>会话方式</dt><dd>预设演示账号，不收真实密码</dd></div><div><dt>生产鉴权</dt><dd>未接入；必须由服务端实现</dd></div></dl>${metricScope}<div class="rv1-banner rv1-warn"><strong>不能把前端隐藏当成安全</strong>本版本通过独立角色数据键和租户校验限制演示读写范围，但静态 HTML 仍包含历史示例代码。生产环境必须使用服务端鉴权、租户过滤和审计。</div><div class="rv1-actions"><button type="button" class="rv1-button rv1-danger" data-action="logout">退出演示账号</button></div></section>`}
function reportDialog(data){return `<dialog id="rv1-report-dialog" class="rv1-dialog" aria-labelledby="rv1-report-title"><div class="rv1-dialog-inner"><h2 id="rv1-report-title">新建故障报修</h2><p class="rv1-lead">表单只生成本地脱敏演示工单，不含语音识别或真实派单。</p><form id="rv1-report-form" class="rv1-form" action="#" method="post"><div class="rv1-field"><label for="rv1-report-vehicle">车辆</label><select id="rv1-report-vehicle" name="vehicle" required>${data.vehicles.map(v=>`<option value="${esc(v.id)}">${esc(v.id)} · ${esc(v.model)}</option>`).join("")}</select></div><div class="rv1-field"><label for="rv1-report-summary">故障描述</label><span id="rv1-report-help"><small>请勿填写真实个人信息；至少 4 个字符。</small></span><textarea id="rv1-report-summary" name="summary" minlength="4" maxlength="180" required aria-describedby="rv1-report-help"></textarea></div><fieldset class="rv1-fieldset rv1-field"><legend>紧急程度</legend><div class="rv1-radio-row"><label class="rv1-radio"><input type="radio" name="priority" value="普通" checked>普通</label><label class="rv1-radio"><input type="radio" name="priority" value="优先">优先</label></div></fieldset><div class="rv1-dialog-actions"><button type="button" class="rv1-button rv1-secondary" data-close="rv1-report-dialog">取消</button><button type="submit" class="rv1-button">确认提交报修</button></div></form></div></dialog>`}
function rentalMetrics(data){const states=new Set(["在租","可租","维修","待交付"]);const pool=data.assets.filter(a=>a.kind==="车辆"&&states.has(a.businessState));const rented=pool.filter(a=>a.businessState==="在租");const available=pool.filter(a=>a.businessState==="可租");return{pool,rented,available,repair:pool.filter(a=>a.businessState==="维修"),pending:pool.filter(a=>a.businessState==="待交付"),ratio:pool.length?`${(rented.length/pool.length*100).toFixed(1)}%`:"暂无"}}
function rentalHome(data){const m=rentalMetrics(data);const unpaid=data.receivables.reduce((sum,r)=>sum+Math.max(0,r.amount-r.paid),0),unpaidRows=data.receivables.filter(r=>r.amount>r.paid).length,drafts=data.contracts.filter(x=>x.status==="草稿").length,expiring=data.contracts.filter(x=>x.status==="即将到期").length,offlineRented=data.assets.filter(x=>x.kind==="车辆"&&x.businessState==="在租"&&x.iotState==="离线").length;const tasks=[drafts&&{count:drafts,title:"待确认合同草稿",detail:"确认后为待生效，交付不自动生效",page:"contracts",tone:"pink"},expiring&&{count:expiring,title:"即将到期合同",detail:"只作经营提醒，不自动催收",page:"contracts",tone:"amber"},unpaidRows&&{count:unpaidRows,title:"未结清应收",detail:"本地示例账本，不连接银行",page:"ledger",tone:"red"},offlineRented&&{count:offlineRented,title:"在租车辆离线",detail:"物联离线不等于停租",page:"assets",tone:"blue"}].filter(Boolean);return `${homeHeading("租赁经营账本")}<section class="rv12-hero" aria-label="今日经营待办"><div><small>今日经营待办</small><h2>先处理 ${tasks.length} 件事</h2><p>围绕资产、合同与本地回款；数量由当前示例数据生成。</p></div><time datetime="${data.statDate}">${data.statDate.slice(5).replace("-","/")}</time></section><ul class="rv12-tasks" role="list">${tasks.map(item=>`<li><button type="button" data-page="${item.page}"><i class="rv12-task-number ${item.tone}">${item.count}</i><span class="rv12-task-copy"><b>${item.title}</b><small>${item.detail}</small></span><em class="rv12-task-action">处理</em></button></li>`).join("")}</ul><section class="rv1-grid rv1-metrics" aria-label="租赁经营概览"><article class="rv1-card"><span class="rv1-metric-label">当前出租比例</span><strong class="rv1-metric-value" data-test="rental-ratio">${m.ratio}</strong><small class="rv1-metric-help" data-test="rental-ratio-detail">在租 ${m.rented.length} / 经营车辆池 ${m.pool.length} · i 查看口径</small></article><article class="rv1-card"><span class="rv1-metric-label">当前可租</span><strong class="rv1-metric-value">${m.available.length}</strong><small class="rv1-metric-help">仅业务状态“可租”</small></article><article class="rv1-card"><span class="rv1-metric-label">维修车辆</span><strong class="rv1-metric-value">${m.repair.length}</strong><small class="rv1-metric-help">维修天数不算闲置</small></article><article class="rv1-card"><span class="rv1-metric-label">未收余额</span><strong class="rv1-metric-value">${money(unpaid)}</strong><small class="rv1-metric-help">本地示例账本口径</small></article></section><div class="rv1-section-heading"><h2>可租车辆闲置天数</h2><p>示例统计日 ${data.statDate}</p></div><ul class="rv1-list" role="list">${m.available.map(asset=>{const days=daysBetween(asset.demoStatusSince,data.statDate);return `<li class="rv1-list-item"><div class="rv1-list-row"><div><h3>${esc(asset.code)} · ${esc(asset.model)}</h3><p>${asset.demoStatusSince?`示例状态起始日 ${esc(asset.demoStatusSince)}`:"缺少状态起始日，不能计算"}</p><div class="rv1-meta"><span>业务状态 ${esc(asset.businessState)}</span><span>物联状态 ${esc(asset.iotState)}</span><span>${esc(asset.location)}</span></div></div>${badge(days===null?"暂无":`${days} 天`,days!==null&&days>=15?"warn":"blue")}</div>${asset.stateNote?`<p>${esc(asset.stateNote)}</p>`:""}</li>`}).join("")}</ul><div class="rv1-section-heading"><h2>经营入口</h2><p>不自动催收、锁车或停租</p></div><section class="rv1-grid rv1-three"><button type="button" class="rv1-card-button" data-page="assets"><strong>查看自有资产</strong><small>业务状态和物联状态分开</small></button><button type="button" class="rv1-card-button" data-page="contracts"><strong>合同执行</strong><small>交付日与生效日分开</small></button><button type="button" class="rv1-card-button" data-page="ledger"><strong>应收与本地回款</strong><small>软件账本，不连接银行</small></button></section>`}
function rentalAssets(data){const m=rentalMetrics(data);return `${heading("自有资产","出租比例只统计车辆；电池和充电机保留在资产台账，但不进入分母。")}${data.assets.map(asset=>`<article class="rv1-card" style="margin-block-start:1rem"><div class="rv1-list-row"><div><h2>${esc(asset.code)} · ${esc(asset.model)}</h2><p class="rv1-lead">${esc(asset.kind)} · ${esc(asset.location)}</p></div>${badge(asset.businessState,asset.businessState==="在租"?"good":asset.businessState==="维修"?"bad":"blue")}</div><dl class="rv1-dl" style="margin-block-start:1rem"><div><dt>业务状态</dt><dd>${esc(asset.businessState)}</dd></div><div><dt>物联状态</dt><dd>${esc(asset.iotState)}</dd></div><div><dt>是否进入经营车辆池</dt><dd>${asset.kind==="车辆"&&["在租","可租","维修","待交付"].includes(asset.businessState)?"是":"否"}</dd></div><div><dt>可租闲置天数</dt><dd>${asset.businessState==="可租"?(daysBetween(asset.demoStatusSince,data.statDate)===null?"暂无":`${daysBetween(asset.demoStatusSince,data.statDate)} 天`):"不适用"}</dd></div></dl>${asset.stateNote?`<div class="rv1-banner rv1-info">${esc(asset.stateNote)}</div>`:""}</article>`).join("")}<p class="rv1-lead" style="margin-block-start:1rem">当前计算：在租 ${m.rented.length} / 经营车辆池 ${m.pool.length} = ${m.ratio}（示例）。</p>`}
function rentalContracts(data){const customer=id=>data.customers.find(x=>x.id===id)?.name||"未关联客户";return `${heading("合同","租赁商可在独立角色数据层操作草稿；确认草稿只变为待生效，交付不会自动生效。")}${data.contracts.map(contract=>`<article class="rv1-card" style="margin-block-start:1rem"><div class="rv1-list-row"><div><h2>${esc(contract.no)}</h2><p class="rv1-lead">${esc(customer(contract.customerId))}</p></div>${badge(contract.status,contract.status==="履约中"?"good":contract.status==="即将到期"?"warn":"blue")}</div><dl class="rv1-dl" style="margin-block-start:1rem"><div><dt>交付日期</dt><dd>${esc(contract.deliveryDate)}</dd></div><div><dt>计租生效日期</dt><dd>${esc(contract.effectiveDate)}</dd></div><div><dt>计划到期</dt><dd>${esc(contract.endDate)}</dd></div><div><dt>合同资产数</dt><dd>${contract.assetIds.length}</dd></div></dl>${contract.status==="草稿"?`<div class="rv1-actions"><button type="button" class="rv1-button" data-confirm-contract="${esc(contract.id)}">确认草稿为待生效</button></div>`:""}</article>`).join("")}`}
function rentalLedger(data){const contract=id=>data.contracts.find(x=>x.id===id);return `${heading("应收与回款账本","本地演示登记，不连接银行、支付、税控；租金与押金分账，不自动催收或锁车。")}<div class="rv1-table-wrap" style="margin-block-start:1rem"><table class="rv1-table"><caption>本地示例应收</caption><thead><tr><th scope="col">合同</th><th scope="col">类型/期间</th><th scope="col">应收</th><th scope="col">已登记</th><th scope="col">余额</th><th scope="col">操作</th></tr></thead><tbody>${data.receivables.map(r=>{const balance=Math.max(0,r.amount-r.paid);return `<tr><th scope="row">${esc(contract(r.contractId)?.no||r.contractId)}</th><td>${esc(r.type)} · ${esc(r.period)}<br><small>应收日 ${esc(r.dueDate)}</small></td><td>${money(r.amount)}</td><td>${money(r.paid)}</td><td>${money(balance)}</td><td>${balance>0?`<button type="button" class="rv1-button rv1-secondary" data-payment="${esc(r.id)}">登记线下回款</button>`:"已结清"}</td></tr>`}).join("")}</tbody></table></div>${paymentDialog()}`}
function paymentDialog(){return `<dialog id="rv1-payment-dialog" class="rv1-dialog" aria-labelledby="rv1-payment-title"><div class="rv1-dialog-inner"><h2 id="rv1-payment-title">登记线下回款</h2><p class="rv1-lead">仅写入 ${RENTAL_KEY}，不修改 ${PROTECTED_LEGACY_LEDGER_KEY}，不连接银行或在线支付。</p><form id="rv1-payment-form" class="rv1-form" action="#" method="post"><input type="hidden" id="rv1-payment-id" name="receivable"><div class="rv1-field"><label for="rv1-payment-amount">本次登记金额</label><input id="rv1-payment-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required aria-describedby="rv1-payment-help"><small id="rv1-payment-help">不能超过当前未收余额。</small></div><div class="rv1-field"><label for="rv1-payment-note">备注</label><textarea id="rv1-payment-note" name="note" maxlength="120">本地演示回款登记</textarea></div><div class="rv1-dialog-actions"><button type="button" class="rv1-button rv1-secondary" data-close="rv1-payment-dialog">取消</button><button type="submit" class="rv1-button">确认登记</button></div></form></div></dialog>`}
function contentFor(account){
 if(account.role==="customer"){const data=customerStore();return page==="alarm-detail"?customerAlarmDetail(data,account,detailId):page==="vehicle-detail"?customerVehicleDetail(data,account,detailId):page==="order-detail"?customerOrderDetail(data,account,detailId):page==="vehicles"?customerVehicles(data):page==="orders"?customerOrders(data):page==="contracts"?customerContracts(data):page==="account"?accountPage(account):customerHome(data)}
 const data=rentalStore();return page==="assets"?rentalAssets(data):page==="contracts"?rentalContracts(data):page==="ledger"?rentalLedger(data):page==="account"?accountPage(account):rentalHome(data)
}
function render(){
 if(legacyMode)return;
 document.body.classList.add("rv1-active");legacyRoot.hidden=true;legacyRoot.inert=true;app.hidden=false;app.inert=false;
 const current=session();if(!current){document.title="选择演示账号 | KION FLEET";app.innerHTML=loginView();return}
 const account=ACCOUNTS[current.role];document.title=`${pageName(account.role,page)} | KION FLEET 角色演示`;app.innerHTML=shell(account,contentFor(account));bindForms(account);
}
function pageName(role,id){if(id==="alarm-detail")return"设备报警详情";if(id==="vehicle-detail")return"车辆详情";if(id==="order-detail")return"工单详情";const item=navItems(role).find(([key])=>key===id);return item?item[1]:"首页"}
function openDialog(id,trigger){const dialog=document.getElementById(id);if(!dialog)return;dialog.dataset.returnFocus=trigger?.id||"";dialog.showModal();requestAnimationFrame(()=>dialog.querySelector("select,input,textarea,button")?.focus())}
function closeDialog(id){document.getElementById(id)?.close()}
function bindForms(account){
 const report=document.getElementById("rv1-report-form");if(report)report.addEventListener("submit",event=>{event.preventDefault();if(!report.reportValidity())return;const form=new FormData(report);try{createCustomerOrder(account,String(form.get("vehicle")),String(form.get("summary")||""),String(form.get("priority")||"普通"))}catch(error){announce(error.message);return}closeDialog("rv1-report-dialog");page="orders";render();requestAnimationFrame(()=>document.getElementById("rv1-page-title")?.focus());announce("本地演示工单已创建")});
 const payment=document.getElementById("rv1-payment-form");if(payment)payment.addEventListener("submit",event=>{event.preventDefault();if(!payment.reportValidity())return;const id=document.getElementById("rv1-payment-id").value,amount=Number(document.getElementById("rv1-payment-amount").value);try{registerRentalPayment(account,id,amount,document.getElementById("rv1-payment-note").value)}catch(error){const input=document.getElementById("rv1-payment-amount");input.setCustomValidity(error.message);input.setAttribute("aria-invalid","true");input.reportValidity();input.focus();return}closeDialog("rv1-payment-dialog");render();requestAnimationFrame(()=>document.getElementById("rv1-page-title")?.focus());announce("本地演示回款已登记；未连接银行")});
 document.getElementById("rv1-payment-amount")?.addEventListener("input",event=>{event.currentTarget.setCustomValidity("");event.currentTarget.removeAttribute("aria-invalid")});
}
app.addEventListener("click",event=>{const button=event.target.closest("button");if(!button)return;if(button.dataset.login){login(button.dataset.login);return}if(button.dataset.alarm){page="alarm-detail";detailId=button.dataset.alarm;render();requestAnimationFrame(()=>document.getElementById("rv1-page-title")?.focus());return}if(button.dataset.vehicleDetail){page="vehicle-detail";detailId=button.dataset.vehicleDetail;render();requestAnimationFrame(()=>document.getElementById("rv1-page-title")?.focus());return}if(button.dataset.orderDetail){page="order-detail";detailId=button.dataset.orderDetail;render();requestAnimationFrame(()=>document.getElementById("rv1-page-title")?.focus());return}if(button.dataset.page){page=button.dataset.page;detailId="";render();requestAnimationFrame(()=>document.getElementById("rv1-page-title")?.focus());return}const action=button.dataset.action;if(action==="review"){showFeedback();return}if(action==="logout"){logout();return}if(action==="legacy"){showLegacy();return}if(action==="open-report"){openDialog("rv1-report-dialog",button);return}if(action==="report-vehicle"){openDialog("rv1-report-dialog",button);const select=document.getElementById("rv1-report-vehicle");if(select)select.value=button.dataset.vehicle;return}if(button.dataset.close){closeDialog(button.dataset.close);return}if(button.dataset.confirmContract){const current=session();if(!current||current.role!=="rental")return;try{confirmRentalContract(ACCOUNTS[current.role],button.dataset.confirmContract)}catch(error){announce(error.message);return}render();announce("合同草稿已确认待生效；交付未自动生效");return}if(button.dataset.payment){const data=rentalStore(),rec=data.receivables.find(x=>x.id===button.dataset.payment);if(!rec)return;openDialog("rv1-payment-dialog",button);document.getElementById("rv1-payment-id").value=rec.id;const input=document.getElementById("rv1-payment-amount");input.max=String(Math.max(0,rec.amount-rec.paid));input.value="";input.focus()}});
document.getElementById("role-legacy-exit-button").addEventListener("click",hideLegacy);
for(const dialog of document.querySelectorAll(".rv1-dialog"))dialog.addEventListener("close",()=>{});
window.__KION_ROLE_V1_TEST__={version:VERSION,keys:{session:SESSION_KEY,customer:CUSTOMER_KEY,rental:RENTAL_KEY,legacyLedger:PROTECTED_LEGACY_LEDGER_KEY,notesDb:LEGACY_NOTES_DB},accounts:clone(ACCOUNTS),metrics:()=>rentalMetrics(rentalStore()),stores:{customer:customerStore,rental:rentalStore},reads:{getCustomerAlarm,getCustomerVehicle,getCustomerOrder},actions:{createCustomerOrder,confirmRentalContract,registerRentalPayment}};
render();
})();
</script>
</body>
</html>
